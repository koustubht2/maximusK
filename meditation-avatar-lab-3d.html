<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─────────────────────────────────────────────────────────────
//  MANDALA GEOMETRY GENERATOR
//  Produces a dense cloud of 3-D points shaped like sacred
//  geometry: concentric rings of petals, Flower-of-Life circles,
//  Sri Yantra triangles, metatron cube edges — all at varying
//  radii so particles have depth and can orbit.
// ─────────────────────────────────────────────────────────────

function buildMandalaPoints(N_total){
  // Returns Float32Array of [x,y,z, layer, role]  (5 floats / point)
  // layer  0=core  1=inner  2=mid  3=outer  4=fringe
  // role   0=ring  1=petal  2=triangle  3=metatron  4=free

  const out   = [];   // will hold {x,y,z,layer,role,base}

  const TWO_PI = Math.PI * 2;
  const jitter = (a) => a * (0.85 + Math.random()*0.30);

  // ── Flower of Life: 7 circles, each circle = ring of points ──
  const FOL_CENTERS = [{x:0,y:0}];
  for(let i=0;i<6;i++){
    const a = (i/6)*TWO_PI; FOL_CENTERS.push({x:Math.cos(a),y:Math.sin(a)});
  }
  // Each of those 6 outer centres also spawns 6 more (2nd ring)
  for(let i=0;i<6;i++){
    const a=(i/6)*TWO_PI, cx=Math.cos(a)*2, cy=Math.sin(a)*2;
    for(let j=0;j<6;j++){
      const b=(j/6)*TWO_PI; FOL_CENTERS.push({x:cx+Math.cos(b),y:cy+Math.sin(b)});
    }
  }

  function addRing(cx,cy,cz,r,count,layer,role,zSpread){
    for(let i=0;i<count;i++){
      const a=(i/count)*TWO_PI;
      const jx=(Math.random()-.5)*r*.12, jy=(Math.random()-.5)*r*.12;
      const z=(Math.random()-.5)*(zSpread||0.08);
      out.push({x:cx+Math.cos(a)*jitter(r)+jx, y:cy+Math.sin(a)*jitter(r)+jy, z:cz+z, layer, role, base:r});
    }
  }

  function addArc(cx,cy,cz,r,fromA,toA,count,layer,role,zSpread){
    for(let i=0;i<count;i++){
      const t=i/(count-1), a=fromA+(toA-fromA)*t;
      const jx=(Math.random()-.5)*r*.10, jy=(Math.random()-.5)*r*.10;
      const z=(Math.random()-.5)*(zSpread||0.06);
      out.push({x:cx+Math.cos(a)*jitter(r)+jx, y:cy+Math.sin(a)*jitter(r)+jy, z:cz+z, layer, role, base:r});
    }
  }

  // ── 1. Core dot cluster ──
  for(let i=0;i<120;i++){
    const r=Math.random()*.18, a=Math.random()*TWO_PI;
    out.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z:(Math.random()-.5)*.15, layer:0, role:0, base:0});
  }

  // ── 2. FOL circles (inner 7 at unit radius) ──
  for(let ci=0;ci<7;ci++){
    const {x:cx,y:cy}=FOL_CENTERS[ci];
    addRing(cx*.52,cy*.52,0, .52, 48, ci===0?0:1, 0, .10);
  }

  // ── 3. 12-petal lotus (inner) ──
  for(let i=0;i<12;i++){
    const a=(i/12)*TWO_PI, mid=a+(1/12)*TWO_PI*.5;
    const px=Math.cos(mid)*.55, py=Math.sin(mid)*.55;
    addArc(px*.5,py*.5,0, .40, a, a+TWO_PI/12, 30, 1, 1, .08);
  }

  // ── 4. 24-petal lotus (mid) ──
  for(let i=0;i<24;i++){
    const a=(i/24)*TWO_PI, mid=a+(1/24)*TWO_PI*.5;
    const px=Math.cos(mid)*.90, py=Math.sin(mid)*.90;
    addArc(px*.55,py*.55,0, .48, a, a+TWO_PI/24, 22, 2, 1, .12);
  }

  // ── 5. Sri Yantra — 9 interlocking triangles (4 up, 5 down) ──
  const SRI_RADII = [.22,.34,.48,.60,.72,.84,.96,1.08,1.20];
  SRI_RADII.forEach((r,ri)=>{
    const up = ri%2===0;
    for(let v=0;v<3;v++){
      const a0 = (up? -Math.PI/2 : Math.PI/2) + (v/3)*TWO_PI;
      const a1 = (up? -Math.PI/2 : Math.PI/2) + ((v+1)/3)*TWO_PI;
      addArc(0,0,0, r, a0, a1, 28, ri<3?1:ri<6?2:3, 2, .10);
    }
  });

  // ── 6. Metatron's Cube — 13 circles + connecting lines ──
  const META_R = [.32,.64,.96,1.28];
  META_R.forEach((r,ri)=>{
    addRing(0,0,0, r, 60+ri*20, ri<2?2:3, 3, .12+ri*.04);
  });
  // Metatron spokes (6 directions × 2 rings)
  for(let i=0;i<6;i++){
    const a=(i/6)*TWO_PI;
    addArc(0,0,0, .96, a-.02, a+.02, 18, 2, 3, .08);
    addArc(0,0,0, 1.28, a-.015, a+.015, 14, 3, 3, .10);
  }

  // ── 7. Vesica Piscis pairs (6 sets) ──
  for(let i=0;i<6;i++){
    const a=(i/6)*TWO_PI;
    const cx=Math.cos(a)*.52, cy=Math.sin(a)*.52;
    addArc(cx,cy,0, .52, a+Math.PI*.25, a+Math.PI*1.75, 30, 2, 1, .09);
  }

  // ── 8. Outer concentric halos (4 rings) ──
  [1.30,1.52,1.72,1.92].forEach((r,ri)=>{
    addRing(0,0,(ri*.04-.06), r, 80+ri*16, 3, 0, .14+ri*.04);
  });

  // ── 9. Fringe scatter — stardust beyond the outer edge ──
  for(let i=0;i<300;i++){
    const r=1.85+Math.random()*.55, a=Math.random()*TWO_PI;
    const z=(Math.random()-.5)*.35;
    out.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z, layer:4, role:4, base:r});
  }

  // ── 10. Fill to N_total with extra petal/ring density ──
  while(out.length < N_total){
    const pick=Math.random();
    if(pick<.35){ // extra inner petal
      const r=.3+Math.random()*.7, a=Math.random()*TWO_PI;
      const z=(Math.random()-.5)*.20;
      out.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z, layer:1, role:1, base:r});
    } else if(pick<.70){ // extra mid geometry
      const r=.6+Math.random()*.5, a=Math.random()*TWO_PI;
      const z=(Math.random()-.5)*.18;
      out.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z, layer:2, role:2, base:r});
    } else { // outer fill
      const r=1.1+Math.random()*.8, a=Math.random()*TWO_PI;
      const z=(Math.random()-.5)*.25;
      out.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z, layer:3, role:0, base:r});
    }
  }

  return out.slice(0, N_total);
}

// ─────────────────────────────────────────────────────────────
//  VARIANTS
// ─────────────────────────────────────────────────────────────
const VARIANTS = [
  {
    id:'A', name:'Violet Soul',
    core:[.93,.88,1.0], mid:[.62,.45,.98], shell:[.39,.27,.90], fringe:[.25,.18,.72],
    bloomStr:1.2, bloomRad:.60, bloomThr:.10,
    orbitSpeed:0.055, breathPulse:1.0,
    ring1:'#8b7cf8', ring2:'#6366f1', ring3:'#a78bfa',
  },
  {
    id:'B', name:'Rose Amethyst',
    core:[1.0,.90,.96], mid:[.80,.42,.72], shell:[.60,.28,.62], fringe:[.38,.18,.48],
    bloomStr:1.5, bloomRad:.70, bloomThr:.08,
    orbitSpeed:0.045, breathPulse:1.2,
    ring1:'#e879f9', ring2:'#c026d3', ring3:'#f0abfc',
  },
  {
    id:'C', name:'Ice Temple',
    core:[.90,.96,1.0], mid:[.45,.60,.98], shell:[.28,.42,.85], fringe:[.16,.28,.65],
    bloomStr:1.0, bloomRad:.50, bloomThr:.13,
    orbitSpeed:0.065, breathPulse:.85,
    ring1:'#93c5fd', ring2:'#6366f1', ring3:'#bfdbfe',
  },
  {
    id:'D', name:'Golden Om',
    core:[1.0,.95,.72], mid:[.90,.72,.28], shell:[.72,.52,.14], fringe:[.50,.36,.08],
    bloomStr:1.3, bloomRad:.65, bloomThr:.09,
    orbitSpeed:0.040, breathPulse:1.1,
    ring1:'#fbbf24', ring2:'#d97706', ring3:'#fde68a',
  },
];

// ─────────────────────────────────────────────────────────────
//  BREATH
// ─────────────────────────────────────────────────────────────
const PHASE_NAMES = ['Breathe in','Hold','Breathe out','Rest'];
const PHASE_DUR   = [4,4,6,2];
const CYCLE       = 16;

let _phase=3, _phaseT=0, _bs=0.72;
let _animating=false, _animStart=null, _animRaf=null;
let _variant=0;

function bsTarget(ph,pt){
  if(ph===0) return .72+pt*.28;
  if(ph===1) return 1.0;
  if(ph===2) return 1.0-pt*.28;
  return .72;
}

// ─────────────────────────────────────────────────────────────
//  BUILD PARTICLE DATA
// ─────────────────────────────────────────────────────────────
const N      = 7200;
const MPTS   = buildMandalaPoints(N);

// Each particle has: home position, phase offsets for drift,
// layer/role for colouring, and orbit angle
const homeX  = new Float32Array(N);
const homeY  = new Float32Array(N);
const homeZ  = new Float32Array(N);
const phA    = new Float32Array(N);  // drift phase x
const phB    = new Float32Array(N);  // drift phase y
const phC    = new Float32Array(N);  // drift phase z
const layer  = new Uint8Array(N);
const role   = new Uint8Array(N);
const baseR  = new Float32Array(N);  // normalised 0-1 (radius / max_radius)
const isBig  = new Uint8Array(N);
// orbit: each particle slowly rotates around Z and tilts around X
const orbitA = new Float32Array(N);  // initial orbit angle
const orbitR = new Float32Array(N);  // how much it orbits (0 = stays put)

const MAX_R = 2.5;

MPTS.forEach((p,i)=>{
  homeX[i] = p.x; homeY[i] = p.y; homeZ[i] = p.z;
  phA[i] = Math.random()*Math.PI*2;
  phB[i] = Math.random()*Math.PI*2;
  phC[i] = Math.random()*Math.PI*2;
  layer[i]  = p.layer;
  role[i]   = p.role;
  baseR[i]  = Math.min(1, p.base / MAX_R);
  isBig[i]  = Math.random() < (p.layer===0?.6:p.layer===1?.3:.18) ? 1 : 0;
  orbitA[i] = Math.random()*Math.PI*2;
  // outer particles orbit more; inner core stays mostly fixed
  orbitR[i] = p.layer===0 ? .005
             : p.layer===1 ? .020
             : p.layer===2 ? .040
             : p.layer===3 ? .065
             :               .10;
});

// ─────────────────────────────────────────────────────────────
//  THREE.JS RENDERER
// ─────────────────────────────────────────────────────────────
const canvas  = document.getElementById('medCanvas');
const BLOOM_L = 1;
const bMask   = new THREE.Layers(); bMask.set(BLOOM_L);

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setClearColor(0,0);
const DPR = Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38,1,.1,100);
camera.position.set(0,0,5.5);
camera.layers.enableAll();

const mandalaGroup = new THREE.Group(); scene.add(mandalaGroup);
const ringGroup    = new THREE.Group(); scene.add(ringGroup);

// ── gradient sprite helper ──
function gradSprite(stops){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'), gr=g.createRadialGradient(128,128,0,128,128,128);
  stops.forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

// ── CORE BLOOM sprite ──
const coreSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: gradSprite([[0,'rgba(255,255,255,.98)'],[.15,'rgba(220,200,255,.75)'],[.4,'rgba(160,120,255,.35)'],[.7,'rgba(100,70,220,.10)'],[1,'rgba(0,0,0,0)']]),
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false, opacity:.80,
}));
coreSprite.scale.setScalar(.28); coreSprite.layers.set(BLOOM_L); scene.add(coreSprite);

// ── NEBULA (breath halo) ──
const nebulaSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: gradSprite([[0,'rgba(200,170,255,.88)'],[.12,'rgba(150,110,250,.50)'],[.30,'rgba(110,75,230,.24)'],[.55,'rgba(75,50,200,.08)'],[1,'rgba(0,0,0,0)']]),
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false, opacity:.28,
}));
nebulaSprite.scale.setScalar(.65); nebulaSprite.position.z=-.4; nebulaSprite.layers.set(BLOOM_L); scene.add(nebulaSprite);

// ── OUTER HALO ──
const haloSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: gradSprite([[0,'rgba(170,140,255,.40)'],[.25,'rgba(120,90,240,.18)'],[.55,'rgba(80,55,200,.07)'],[1,'rgba(0,0,0,0)']]),
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false, opacity:.15,
}));
haloSprite.scale.setScalar(2.4); haloSprite.position.z=-1.2; haloSprite.layers.set(BLOOM_L); scene.add(haloSprite);

// ── PARTICLE BUFFERS ──
const pPos  = new Float32Array(N*3);
const pCol  = new Float32Array(N*3);
const pSize = new Float32Array(N);
const pGeo  = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('aSize',    new THREE.BufferAttribute(pSize,1));

// soft glow particle texture
const dotTex = (function(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'), gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(.28,'rgba(210,190,255,.92)');
  gr.addColorStop(.60,'rgba(150,110,255,.38)');
  gr.addColorStop(1,'rgba(80,50,200,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();

const pMat = new THREE.ShaderMaterial({
  uniforms:{ uScale:{value:160}, uTex:{value:dotTex} },
  vertexColors:true, transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending,
  vertexShader:'attribute float aSize; varying vec3 vCol; uniform float uScale;\nvoid main(){ vCol=color; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=aSize*uScale/-mv.z; gl_Position=projectionMatrix*mv; }',
  fragmentShader:'uniform sampler2D uTex; varying vec3 vCol;\nvoid main(){ vec4 t=texture2D(uTex,gl_PointCoord); gl_FragColor=vec4(vCol*t.rgb,t.a); }',
});
const pts = new THREE.Points(pGeo,pMat);
pts.layers.set(0); mandalaGroup.add(pts);

// ── HUD RINGS ──
function arcLine(r,segs,color,op,s0,len){
  const pts2=[]; const s=s0||0, l=len!=null?len:Math.PI*2;
  for(let i=0;i<=segs;i++){ const a=s+(i/segs)*l; pts2.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0)); }
  const geo=new THREE.BufferGeometry().setFromPoints(pts2);
  const ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color:new THREE.Color(color),transparent:true,opacity:op,depthWrite:false}));
  ln.layers.set(0); return ln;
}

const RG1=new THREE.Group(); ringGroup.add(RG1);
[[.28,2.10],[2.95,1.40],[5.30,0.90]].forEach(([s,l])=>{
  RG1.add(arcLine(1.96,90,'#8b7cf8',.85,s,l));
  RG1.add(arcLine(1.98,90,'#8b7cf8',.35,s,l));
});
const RG2=new THREE.Group(); ringGroup.add(RG2);
RG2.add(arcLine(2.22,200,'#a78bfa',.65));
const RG3=new THREE.Group(); ringGroup.add(RG3);
(function(){
  const TICKS=72,r=2.46,sm=[],lg=[];
  for(let i=0;i<TICKS;i++){
    const major=i%6===0,a=(i/TICKS)*Math.PI*2,c=Math.cos(a),s=Math.sin(a);
    const inn=major?r-.09:r-.045; (major?lg:sm).push(c*inn,s*inn,0,c*r,s*r,0);
  }
  const gsm=new THREE.BufferGeometry(); gsm.setAttribute('position',new THREE.BufferAttribute(new Float32Array(sm),3));
  RG3.add(new THREE.LineSegments(gsm,new THREE.LineBasicMaterial({color:0xb4a4f8,transparent:true,opacity:.28,depthWrite:false})));
  const glg=new THREE.BufferGeometry(); glg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lg),3));
  RG3.add(new THREE.LineSegments(glg,new THREE.LineBasicMaterial({color:0xddd6fe,transparent:true,opacity:.65,depthWrite:false})));
})();

// ── BLOOM ──
let bloomPass=new UnrealBloomPass(new THREE.Vector2(1,1),1.2,.60,.10);
const bloomComp=new EffectComposer(renderer);
bloomComp.renderToScreen=false;
bloomComp.addPass(new RenderPass(scene,camera));
bloomComp.addPass(bloomPass);

const finalPass=new ShaderPass(new THREE.ShaderMaterial({
  uniforms:{baseTexture:{value:null},bloomTexture:{value:bloomComp.renderTarget2.texture}},
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:'uniform sampler2D baseTexture; uniform sampler2D bloomTexture; varying vec2 vUv; void main(){ gl_FragColor=texture2D(baseTexture,vUv)+vec4(texture2D(bloomTexture,vUv).rgb,0.); }',
}),'baseTexture'); finalPass.needsSwap=true;

const finalComp=new EffectComposer(renderer);
finalComp.addPass(new RenderPass(scene,camera));
finalComp.addPass(finalPass);

const _hidden=[];
function hideNB(o){ if((o.isMesh||o.isPoints||o.isLine||o.isLineSegments||o.isSprite)&&!o.layers.test(bMask)&&o.visible){ o.visible=false;_hidden.push(o);} }
function restVis(){ _hidden.forEach(o=>o.visible=true); _hidden.length=0; }

function sizeR(){
  const s=canvas.clientWidth||340;
  renderer.setSize(s,s,false);
  bloomComp.setSize(s,s); finalComp.setSize(s,s);
  camera.aspect=1; camera.updateProjectionMatrix();
  pMat.uniforms.uScale.value=160*(s*DPR)/720;
}
new ResizeObserver(sizeR).observe(canvas); sizeR();

// ── PARTICLE UPDATE ──
function updateParticles(t, bs){
  const v = VARIANTS[_variant];
  // slow overall mandala rotation in 3D: yaw + gentle pitch
  const yaw   = t * v.orbitSpeed;
  const pitch = Math.sin(t*.13) * .12;
  const cosY=Math.cos(yaw),sinY=Math.sin(yaw);
  const cosP=Math.cos(pitch),sinP=Math.sin(pitch);

  // exhale causes outer particles to drift outward (breath release)
  const exhaleBloom = _phase===2 ? 1+_phaseT*.35 : 1;
  // inhale draws particles slightly inward (gathering)
  const inhaleGather = _phase===0 ? 1-_phaseT*.06 : 1;
  const radScale = bs * exhaleBloom * inhaleGather;

  for(let i=0;i<N;i++){
    // layer-specific orbit speed — inner layers nearly static, outer rotate
    const oSpeed = v.orbitSpeed * (0.3 + layer[i]*0.5);
    orbitA[i] += oSpeed * .016; // approximate dt; real dt below in frame()

    // orbit the home position around Z
    const oa=orbitA[i], or=orbitR[i];
    const ox=homeX[i]+Math.cos(oa)*or - homeX[i]*or*.5;
    const oy=homeY[i]+Math.sin(oa)*or - homeY[i]*or*.5;
    const oz=homeZ[i];

    // micro-drift (organic noise per particle)
    const dScale = .025 + baseR[i]*.025;
    const ds = .55 + baseR[i]*.4;
    const dx=Math.sin(t*ds+phA[i])*dScale;
    const dy=Math.cos(t*ds+phB[i])*dScale;
    const dz=Math.sin(t*ds*1.3+phC[i])*dScale*.6;

    // radius-breathing: particles move outward/inward with breath
    const breathR = 1 + (radScale-1) * (0.4+baseR[i]*.6); // outer particles breathe more
    let px = (ox+dx)*breathR;
    let py = (oy+dy)*breathR;
    let pz = (oz+dz)*breathR;

    // rotate entire mandala: yaw (around Y) then pitch (around X)
    const rx = px*cosY + pz*sinY;
    const rz =-px*sinY + pz*cosY;
    const ry = py*cosP - rz*sinP;
    const rz2= py*sinP + rz*cosP;

    pPos[i*3]=rx; pPos[i*3+1]=ry; pPos[i*3+2]=rz2;

    // ── colour by layer + depth ──
    const depth=(rz2+2.5)/5;   // 0-1 depth (front bright)
    const dBright=.30+.70*(depth*depth);

    const cr=v.core, md=v.mid, sh=v.shell, fr=v.fringe;
    let cr3, cg3, cb3, sz;

    if(layer[i]===0){        // core
      cr3=cr[0]; cg3=cr[1]; cb3=cr[2]; sz=.13;
    } else if(layer[i]===1){ // inner petal/ring
      const t2=baseR[i]/.5;
      cr3=cr[0]*(1-t2)+md[0]*t2; cg3=cr[1]*(1-t2)+md[1]*t2; cb3=cr[2]*(1-t2)+md[2]*t2;
      sz=.095;
    } else if(layer[i]===2){ // mid geometry
      const t2=(baseR[i]-.3)/.5;
      cr3=md[0]*(1-t2)+sh[0]*t2; cg3=md[1]*(1-t2)+sh[1]*t2; cb3=md[2]*(1-t2)+sh[2]*t2;
      sz=.082;
    } else if(layer[i]===3){ // outer halo
      cr3=sh[0]; cg3=sh[1]; cb3=sh[2]; sz=.072;
    } else {                  // fringe stardust
      cr3=fr[0]; cg3=fr[1]; cb3=fr[2]; sz=.055;
    }

    // role highlight: triangles slightly brighter, metatron slightly bigger
    let roleMult=1;
    if(role[i]===2) roleMult=1.18;
    if(role[i]===3){ roleMult=1.12; sz*=1.15; }

    const a = dBright*roleMult;
    pCol[i*3]=cr3*a; pCol[i*3+1]=cg3*a; pCol[i*3+2]=cb3*a;
    pSize[i] = sz * (isBig[i]?1.8:1) * (.6+.7*depth);
  }

  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
  pGeo.attributes.aSize.needsUpdate=true;
}

// ── MAIN LOOP ──
const clock=new THREE.Clock();
let pingT=-1;
canvas.addEventListener('click',()=>{ pingT=0.01; });

function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;

  // smooth breath scale
  _bs += (bsTarget(_phase,_phaseT)-_bs) * Math.min(1,dt*3.2);

  // update orbit angles (proper dt)
  const v=VARIANTS[_variant];
  for(let i=0;i<N;i++) orbitA[i] += v.orbitSpeed*(0.3+layer[i]*.5)*dt;

  updateParticles(t, _bs);

  // rings
  RG1.rotation.z =  t*.022;
  RG2.rotation.z = -t*.038;
  RG3.rotation.z =  t*.016;

  // core glow
  const pulse=.85+.15*Math.sin(t*1.4);
  coreSprite.material.opacity=(.50+_bs*.38)*pulse;
  coreSprite.scale.setScalar(.18+_bs*.18);

  // nebula breath
  nebulaSprite.material.opacity=.14+_bs*.28;
  nebulaSprite.scale.setScalar(.45+_bs*.55);

  // halo
  haloSprite.material.opacity=.08+_bs*.16;
  haloSprite.scale.setScalar(1.7+_bs*.8);

  // ping
  if(pingT>=0){ pingT+=dt*1.4; const k=Math.max(0,1-pingT); mandalaGroup.scale.setScalar(1+k*.12); if(pingT>1.2){pingT=-1;mandalaGroup.scale.setScalar(1);} }

  scene.traverse(hideNB);
  bloomComp.render();
  restVis();
  finalComp.render();
}
frame();

// ─────────────────────────────────────────────────────────────
//  ANIMATION
// ─────────────────────────────────────────────────────────────
window.toggleAnim=function(){
  _animating=!_animating;
  document.getElementById('animBtn').classList.toggle('on',_animating);
  document.getElementById('animBtn').textContent=_animating?'■ Stop':'▶ Live breath';
  if(_animating){_animStart=null;breathTick();}
  else if(_animRaf) cancelAnimationFrame(_animRaf);
};

function breathTick(){
  if(!_animating)return;
  const speed=parseFloat(document.getElementById('speedSelect').value);
  const now=performance.now()/1000*speed;
  if(!_animStart)_animStart=now;
  const el=(now-_animStart)%CYCLE;
  let ph=0,acc=0;
  for(let p=0;p<4;p++){
    if(el<acc+PHASE_DUR[p]){ph=p;_phaseT=(el-acc)/PHASE_DUR[p];break;}
    acc+=PHASE_DUR[p];
  }
  _phase=ph;
  document.getElementById('phaseSelect').value=ph;
  updateBreathUI(ph,_phaseT);
  _animRaf=requestAnimationFrame(breathTick);
}

document.getElementById('phaseSelect').addEventListener('change',function(){
  _phase=parseInt(this.value);_phaseT=0;updateBreathUI(_phase,0);
});

function updateBreathUI(ph,pt){
  document.getElementById('breathLabel').textContent=PHASE_NAMES[ph];
  document.getElementById('phasePct').textContent=Math.round(pt*100)+'%';
}

// ─────────────────────────────────────────────────────────────
//  VARIANTS UI
// ─────────────────────────────────────────────────────────────
(function(){
  const row=document.getElementById('variantRow');
  VARIANTS.forEach((v,i)=>{
    const b=document.createElement('button');
    b.className='vbtn'+(i===0?' active':'');
    b.textContent=v.id+' — '+v.name;
    b.onclick=()=>{
      _variant=i;
      document.querySelectorAll('.vbtn').forEach((x,j)=>x.classList.toggle('active',j===i));
      bloomPass.strength=v.bloomStr; bloomPass.radius=v.bloomRad; bloomPass.threshold=v.bloomThr;
    };
    row.appendChild(b);
  });
})();

window.choose=function(){
  const v=VARIANTS[_variant];
  const b=document.getElementById('banner');
  b.textContent='✓ Variant '+v.id+' "'+v.name+'" chosen — tell me to ship it into index.html';
  b.style.display='';
  setTimeout(()=>{b.style.display='none';},5000);
};

updateBreathUI(3,0);
</script>
