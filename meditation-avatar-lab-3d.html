<script type="module">
import * as THREE from 'three';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';

// ═════════════════════════════════════════════════════════════
//  MANDALA POINT GENERATOR
//  Every point has a fixed polar home (r, theta) on the mandala.
//  z is a tiny depth offset so the disc has slight 3-D thickness.
//  No random walk — geometry is precise and readable.
// ═════════════════════════════════════════════════════════════
function buildMandala(){
  const pts = [];   // {x,y,z, layer, brightness}
  const PI2 = Math.PI * 2;

  function ring(r, n, layer, bright, zSpread=0){
    for(let i=0;i<n;i++){
      const a = (i/n)*PI2;
      const z = (Math.random()-.5)*zSpread;
      pts.push({ x:Math.cos(a)*r, y:Math.sin(a)*r, z, layer, bright });
    }
  }

  function arcPts(cx,cy,r,a0,a1,n,layer,bright,zSpread=0){
    for(let i=0;i<n;i++){
      const t=i/(n-1), a=a0+(a1-a0)*t;
      const z=(Math.random()-.5)*zSpread;
      pts.push({ x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r, z, layer, bright });
    }
  }

  // ── LAYER 0 — core glow cluster ──
  for(let i=0;i<90;i++){
    const r=Math.random()*.12, a=Math.random()*PI2;
    pts.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z:(Math.random()-.5)*.05, layer:0, bright:1.0});
  }

  // ── LAYER 1 — innermost ring + 6-pointed star ──
  ring(.22, 72, 1, .95, .04);
  // Star of David: 2 equilateral triangles
  for(let t=0;t<2;t++){
    const offset = t===0 ? 0 : Math.PI/3;
    for(let v=0;v<3;v++){
      const a0=(v/3)*PI2+offset-Math.PI/2;
      const a1=((v+1)/3)*PI2+offset-Math.PI/2;
      arcPts(0,0,.22,a0,a1,30,1,.90,.04);
    }
  }

  // ── LAYER 2 — 12-petal lotus ──
  // each petal = vesica arc between two points on the ring
  ring(.45, 96, 2, .88, .06);
  for(let i=0;i<12;i++){
    const a = (i/12)*PI2;
    const midA = a + (1/12)*PI2*.5;
    // arc centre offset inward so the petal curves
    const cx = Math.cos(a)*.22, cy = Math.sin(a)*.22;
    arcPts(cx,cy,.26, a+.1, a+PI2/12-.1, 20, 2, .85, .06);
  }

  // ── LAYER 3 — Flower of Life (7 circles) ──
  ring(.45, 6, 3, .80, .06);   // centres of the 6 outer circles
  const folR = .45;
  for(let i=0;i<6;i++){
    const ca=(i/6)*PI2;
    arcPts(Math.cos(ca)*folR, Math.sin(ca)*folR, folR, 0, PI2, 64, 3, .78, .07);
  }
  // centre circle already = layer 2 ring; add extra density
  ring(.45, 24, 3, .82, .05);

  // ── LAYER 4 — Sri Yantra: 9 triangles at increasing radii ──
  const sriR = [.30,.44,.58,.70,.82,.94,1.06,1.18,1.30];
  sriR.forEach((r,ri)=>{
    const up = ri%2===0;
    const baseAngle = up ? -Math.PI/2 : Math.PI/2;
    for(let v=0;v<3;v++){
      const a0=baseAngle+(v/3)*PI2;
      const a1=baseAngle+((v+1)/3)*PI2;
      arcPts(0,0,r,a0,a1,36,4,.72+.04*(3-Math.abs(ri-4))*.1,.07);
    }
  });

  // ── LAYER 5 — 24-petal lotus (mid) ──
  ring(.88, 144, 5, .70, .09);
  for(let i=0;i<24;i++){
    const a=(i/24)*PI2;
    const cx=Math.cos(a)*.44, cy=Math.sin(a)*.44;
    arcPts(cx,cy,.48, a+.05, a+PI2/24-.05, 16, 5, .65, .08);
  }

  // ── LAYER 6 — Metatron's Cube ──
  ring(1.10, 180, 6, .62, .10);
  // 6 long spokes
  for(let i=0;i<6;i++){
    const a=(i/6)*PI2;
    arcPts(0,0,1.10, a-.008, a+.008, 28, 6, .68, .08);
  }
  // 6 cross-spokes (60° offset)
  for(let i=0;i<6;i++){
    const a=(i/6)*PI2+Math.PI/6;
    arcPts(0,0,1.10, a-.006, a+.006, 22, 6, .60, .08);
  }
  // outer metatron ring with tick marks
  ring(1.28, 144, 6, .58, .11);
  for(let i=0;i<12;i++){
    const a=(i/12)*PI2;
    arcPts(0,0,1.28, a-.004, a+.004, 14, 6, .65, .09);
  }

  // ── LAYER 7 — outer concentric halos ──
  [1.48, 1.65, 1.82].forEach((r,ri)=>{
    ring(r, 180+ri*36, 7, .50-.08*ri, .12+ri*.04);
    // radial tick bursts at 12 positions
    for(let i=0;i<12;i++){
      const a=(i/12)*PI2+(ri*.13);
      const r0=r-.04, r1=r+.04;
      for(let j=0;j<8;j++){
        const rr=r0+(r1-r0)*j/7;
        pts.push({x:Math.cos(a)*rr, y:Math.sin(a)*rr, z:(Math.random()-.5)*.12, layer:7, bright:.55-.04*ri});
      }
    }
  });

  // ── LAYER 8 — fringe stardust ──
  for(let i=0;i<280;i++){
    const r=1.88+Math.random()*.50, a=Math.random()*PI2;
    pts.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z:(Math.random()-.5)*.28, layer:8, bright:.35+Math.random()*.15});
  }

  return pts;
}

// ═════════════════════════════════════════════════════════════
//  VARIANTS
// ═════════════════════════════════════════════════════════════
const VARIANTS = [
  {
    id:'A', name:'Violet Soul',
    // colour per layer [R,G,B] — interpolated by layer index
    layerCols:[
      [1.00,.96,1.00],  // 0 core
      [0.94,.88,1.00],  // 1 inner star
      [0.80,.65,.98],   // 2 12-petal
      [0.68,.52,.96],   // 3 flower of life
      [0.55,.40,.92],   // 4 sri yantra
      [0.45,.32,.88],   // 5 24-petal
      [0.36,.26,.80],   // 6 metatron

    ],

  {
    id:'C', name:'Golden Om',
    layerCols:[
      [1.00,.98,.80],
      [1.00,.92,.55],
      [0.95,.78,.30],
      [0.88,.65,.18],
      [0.78,.52,.10],
      [0.68,.42,.06],
      [0.55,.32,.04],
      [0.40,.22,.02],
      [0.26,.14,.01],
    ],
    spinSpeed:.020, bloomStr:1.90, bloomRad:.74, bloomThr:.06,
    tiltAmp:.14,
  },
  {
    id:'D', name:'Ice Temple',
    layerCols:[
      [0.92,.96,1.00],
      [0.80,.90,1.00],
      [0.58,.72,.98],
      [0.40,.58,.96],
      [0.28,.45,.90],
      [0.18,.35,.82],
      [0.12,.26,.72],
      [0.08,.18,.58],
      [0.04,.12,.40],
    ],
    spinSpeed:.034, bloomStr:1.65, bloomRad:.62, bloomThr:.07,
    tiltAmp:.16,
  },
];

// ═════════════════════════════════════════════════════════════
//  BREATH
// ═════════════════════════════════════════════════════════════
const PHASE_NAMES = ['Breathe in','Hold','Breathe out','Rest'];
const PHASE_DUR   = [4,4,6,2];
const CYCLE       = 16;
let _phase=3, _phaseT=0, _bs=0.72;
let _animating=false, _animStart=null, _animRaf=null;
let _variant=0;

function bsTarget(ph,pt){
  if(ph===0) return .72+pt*.28;
  if(ph===1) return 1.0;
  if(ph===2) return 1.0-pt*.28;
  return .72;
}

// ═════════════════════════════════════════════════════════════
//  BUILD POINT DATA
// ═════════════════════════════════════════════════════════════
const RAW = buildMandala();
const N   = RAW.length;

const homeX    = new Float32Array(N);
const homeY    = new Float32Array(N);
const homeZ    = new Float32Array(N);
const layerArr = new Uint8Array(N);
const brightArr= new Float32Array(N);
const shimPh   = new Float32Array(N);
const isBig    = new Uint8Array(N);
// per-particle drift phases (3 axes, like JARVIS)
const driftPhX = new Float32Array(N);
const driftPhY = new Float32Array(N);
const driftPhZ = new Float32Array(N);
// per-particle drift speed multiplier (variety keeps it organic)
const driftSpd = new Float32Array(N);

RAW.forEach((p,i)=>{
  homeX[i]=p.x; homeY[i]=p.y; homeZ[i]=p.z;
  layerArr[i]=p.layer; brightArr[i]=p.bright;
  shimPh[i]  = Math.random()*Math.PI*2;
  driftPhX[i]= Math.random()*Math.PI*2;
  driftPhY[i]= Math.random()*Math.PI*2;
  driftPhZ[i]= Math.random()*Math.PI*2;
  driftSpd[i]= 0.55 + Math.random()*0.90;  // 0.55–1.45× speed variety
  isBig[i] = Math.random() < (.7-.08*p.layer) ? 1 : 0;
});

// ═════════════════════════════════════════════════════════════
//  THREE.JS
// ═════════════════════════════════════════════════════════════
const canvas  = document.getElementById('medCanvas');
const BLOOM_L = 1;
const bMask   = new THREE.Layers(); bMask.set(BLOOM_L);

const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setClearColor(0,0);
const DPR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.80;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36,1,.1,100);
camera.position.set(0,0,5.2);
camera.layers.enableAll();

const mandalaGrp = new THREE.Group(); scene.add(mandalaGrp);
const ringGrp    = new THREE.Group(); scene.add(ringGrp);

// ── gradient sprite ──
function gradSprite(stops){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'), gr=g.createRadialGradient(128,128,0,128,128,128);
  stops.forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

// ── CORE bloom sprite ──
const coreMat=new THREE.SpriteMaterial({
  map:gradSprite([[0,'rgba(255,255,255,.98)'],[.15,'rgba(220,200,255,.78)'],[.38,'rgba(160,120,255,.38)'],[.65,'rgba(100,70,220,.12)'],[1,'rgba(0,0,0,0)']]),
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,opacity:.82,
});
const coreSprite=new THREE.Sprite(coreMat); coreSprite.scale.setScalar(.22); coreSprite.layers.set(BLOOM_L); scene.add(coreSprite);

// ── NEBULA ──
const nebMat=new THREE.SpriteMaterial({
  map:gradSprite([[0,'rgba(200,170,255,.90)'],[.15,'rgba(145,105,248,.50)'],[.35,'rgba(105,70,228,.22)'],[.60,'rgba(70,48,196,.07)'],[1,'rgba(0,0,0,0)']]),
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,opacity:.26,
});
const nebSprite=new THREE.Sprite(nebMat); nebSprite.scale.setScalar(.60); nebSprite.position.z=-.35; nebSprite.layers.set(BLOOM_L); scene.add(nebSprite);

// ── HALO ──
const haloMat=new THREE.SpriteMaterial({
  map:gradSprite([[0,'rgba(165,135,255,.38)'],[.28,'rgba(115,85,238,.16)'],[.58,'rgba(75,52,198,.06)'],[1,'rgba(0,0,0,0)']]),
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,opacity:.14,
});
const haloSprite=new THREE.Sprite(haloMat); haloSprite.scale.setScalar(2.2); haloSprite.position.z=-1.0; haloSprite.layers.set(BLOOM_L); scene.add(haloSprite);

// ── PARTICLES ──
const pPos  = new Float32Array(N*3);
const pCol  = new Float32Array(N*3);
const pSz   = new Float32Array(N);
const pGeo  = new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',   new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('aSize',   new THREE.BufferAttribute(pSz,1));

const dotTex=(function(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'), cx=64, cy=64;
  // sharp bright pinpoint core + soft violet halo
  const gr=g.createRadialGradient(cx,cy,0,cx,cy,64);
  gr.addColorStop(0,    'rgba(255,255,255,1.0)');
  gr.addColorStop(0.08, 'rgba(245,238,255,1.0)');
  gr.addColorStop(0.18, 'rgba(220,200,255,0.95)');
  gr.addColorStop(0.35, 'rgba(175,140,255,0.72)');
  gr.addColorStop(0.55, 'rgba(130,95,248,0.38)');
  gr.addColorStop(0.75, 'rgba(90,60,220,0.14)');
  gr.addColorStop(1.0,  'rgba(60,35,180,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();

const pMat=new THREE.ShaderMaterial({
  uniforms:{uScale:{value:160},uTex:{value:dotTex}},
  vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:'attribute float aSize;varying vec3 vCol;uniform float uScale;\nvoid main(){vCol=color;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*uScale/-mv.z;gl_Position=projectionMatrix*mv;}',
  fragmentShader:'uniform sampler2D uTex;varying vec3 vCol;\nvoid main(){vec4 t=texture2D(uTex,gl_PointCoord);gl_FragColor=vec4(vCol*t.rgb,t.a);}',
});
const ptsMesh=new THREE.Points(pGeo,pMat); ptsMesh.layers.set(0); mandalaGrp.add(ptsMesh);

// ── HUD RINGS ──
function arcLine(r,segs,col,op,s0,len){
  const v=[]; const s=s0||0,l=len!=null?len:Math.PI*2;
  for(let i=0;i<=segs;i++){const a=s+(i/segs)*l; v.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0));}
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(v),
    new THREE.LineBasicMaterial({color:new THREE.Color(col),transparent:true,opacity:op,depthWrite:false}));
  ln.layers.set(0); return ln;
}
const RG1=new THREE.Group(); ringGrp.add(RG1);
[[.30,2.05],[3.00,1.38],[5.38,.88]].forEach(([s,l])=>{
  RG1.add(arcLine(1.96,90,'#8b7cf8',.80,s,l));
  RG1.add(arcLine(1.98,90,'#8b7cf8',.32,s,l));
});
const RG2=new THREE.Group(); ringGrp.add(RG2);
RG2.add(arcLine(2.20,200,'#a78bfa',.62));
const RG3=new THREE.Group(); ringGrp.add(RG3);
(function(){
  const T=72,r=2.44,sm=[],lg=[];
  for(let i=0;i<T;i++){const maj=i%6===0,a=(i/T)*Math.PI*2,c=Math.cos(a),s=Math.sin(a),inn=maj?r-.09:r-.045;(maj?lg:sm).push(c*inn,s*inn,0,c*r,s*r,0);}
  const gSm=new THREE.BufferGeometry(); gSm.setAttribute('position',new THREE.BufferAttribute(new Float32Array(sm),3));
  RG3.add(new THREE.LineSegments(gSm,new THREE.LineBasicMaterial({color:0xb4a4f8,transparent:true,opacity:.26,depthWrite:false})));
  const gLg=new THREE.BufferGeometry(); gLg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lg),3));
  RG3.add(new THREE.LineSegments(gLg,new THREE.LineBasicMaterial({color:0xddd6fe,transparent:true,opacity:.62,depthWrite:false})));
})();

// ── BLOOM ──
let bloomPass=new UnrealBloomPass(new THREE.Vector2(1,1),1.80,.70,.06);
const bComp=new EffectComposer(renderer); bComp.renderToScreen=false;
bComp.addPass(new RenderPass(scene,camera)); bComp.addPass(bloomPass);
const fPass=new ShaderPass(new THREE.ShaderMaterial({
  uniforms:{baseTexture:{value:null},bloomTexture:{value:bComp.renderTarget2.texture}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D baseTexture;uniform sampler2D bloomTexture;varying vec2 vUv;void main(){gl_FragColor=texture2D(baseTexture,vUv)+vec4(texture2D(bloomTexture,vUv).rgb,0.);}',
}),'baseTexture'); fPass.needsSwap=true;
const fComp=new EffectComposer(renderer);
fComp.addPass(new RenderPass(scene,camera)); fComp.addPass(fPass);

const _hid=[];
function hideNB(o){if((o.isMesh||o.isPoints||o.isLine||o.isLineSegments||o.isSprite)&&!o.layers.test(bMask)&&o.visible){o.visible=false;_hid.push(o);}}
function restV(){_hid.forEach(o=>o.visible=true);_hid.length=0;}

function sizeR(){
  const s=canvas.clientWidth||360;
  renderer.setSize(s,s,false); bComp.setSize(s,s); fComp.setSize(s,s);
  camera.aspect=1; camera.updateProjectionMatrix();
  pMat.uniforms.uScale.value=160*(s*DPR)/720;
}
new ResizeObserver(sizeR).observe(canvas); sizeR();

// ═════════════════════════════════════════════════════════════
//  PARTICLE UPDATE
//  Each particle lives near its mandala home position but drifts
//  with independent noise — exactly like JARVIS, but the drift
//  amplitude is small so geometry stays readable.
//
//  Breath drives TWO things separately:
//    • Radial push/pull  — inhale draws inward, exhale bursts out
//    • Z-axis flutter    — exhale sends particles forward (toward cam)
//
//  Outer layers drift more than inner core (same law as JARVIS).
// ═════════════════════════════════════════════════════════════
function updateParticles(t){
  const v  = VARIANTS[_variant];
  const bs = _bs;                        // 0.72 (rest) → 1.0 (inhale peak)
  const bNorm = (bs - .72) / .28;        // 0 → 1

  // ── SPIN ──
  const spinA = t * v.spinSpeed;
  const cosS=Math.cos(spinA), sinS=Math.sin(spinA);

  // ── TILT toward camera on inhale ──
  const tilt = bNorm * v.tiltAmp;
  const cosTilt=Math.cos(tilt), sinTilt=Math.sin(tilt);

  // ── BREATH RADIAL SCALE ──
  // rest=1.0, full inhale=1.10 (gentle gather-then-release)
  const breathS = 1.0 + bNorm * 0.10;

  // ── EXHALE BURST: particles push outward on exhale ──
  // on exhale (phase 2) phaseT goes 0→1, outer particles push harder
  const exhalePush = (_phase===2) ? _phaseT * 0.18 : 0;

  // ── DRIFT SPEED & AMPLITUDE by layer ──
  // Inner layers barely move (mandala structure preserved).
  // Outer layers move more — feels alive without losing shape.
  const DRIFT_AMP  = [0.012, 0.022, 0.032, 0.042, 0.055, 0.065, 0.075, 0.090, 0.110];
  const DRIFT_RATE = [0.40,  0.55,  0.65,  0.75,  0.85,  0.90,  0.95,  1.00,  1.10 ];

  for(let i=0;i<N;i++){
    const lay = layerArr[i];
    const hx=homeX[i], hy=homeY[i], hz=homeZ[i];
    const homeR = Math.sqrt(hx*hx+hy*hy);  // radial distance from centre

    // ── per-particle organic drift (tethered, never wanders far) ──
    const ds = DRIFT_RATE[lay] * driftSpd[i];
    const da = DRIFT_AMP[lay];
    const dx = Math.sin(t*ds        + driftPhX[i]) * da;
    const dy = Math.cos(t*ds*0.97   + driftPhY[i]) * da;
    const dz = Math.sin(t*ds*1.13   + driftPhZ[i]) * da * 0.5;

    // ── breath radial push/pull ──
    // inhale: subtle inward gather on inner layers, stay on outer
    // exhale: outward burst proportional to radius
    const radPush = homeR * exhalePush * (0.3 + lay * 0.12);
    const nx = hx + hx * radPush / (homeR+.0001);
    const ny = hy + hy * radPush / (homeR+.0001);

    // ── apply breath scale ──
    const sx = nx * breathS + dx;
    const sy = ny * breathS + dy;
    const sz = hz            + dz;

    // ── spin around Z ──
    const rx = sx*cosS - sy*sinS;
    const ry = sx*sinS + sy*cosS;
    const rz = sz;

    // ── tilt around X ──
    const ty =  ry*cosTilt - rz*sinTilt;
    const tz =  ry*sinTilt + rz*cosTilt;

    pPos[i*3]=rx; pPos[i*3+1]=ty; pPos[i*3+2]=tz;

    // ── colour ──
    const col = v.layerCols[Math.min(lay, v.layerCols.length-1)];

    // shimmer — faster on outer layers so they sparkle independently
    const shimRate = 1.2 + lay * 0.25;
    const shim = .82 + .18*Math.sin(t*shimRate + shimPh[i]);

    const depth  = (tz+1.5)/3.0;
    const dbright= .60 + .40*(depth*depth);

    const a = brightArr[i]*shim*dbright;
    pCol[i*3]=col[0]*a; pCol[i*3+1]=col[1]*a; pCol[i*3+2]=col[2]*a;

    // ── size ──
    const baseSize = lay<=1 ? .175
                   : lay<=3 ? .145
                   : lay<=5 ? .122
                   : lay<=6 ? .105
                   :          .082;
    pSz[i] = baseSize*(isBig[i]?1.85:1)*(.65+.55*depth);
  }

  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
  pGeo.attributes.aSize.needsUpdate=true;
}

// ── MAIN LOOP ──
const clock=new THREE.Clock();
let pingT=-1;
canvas.addEventListener('click',()=>{ pingT=.01; });

function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;

  // smooth breath
  _bs+=( bsTarget(_phase,_phaseT)-_bs )*Math.min(1,dt*3.0);

  updateParticles(t);

  // rings rotate gently
  RG1.rotation.z =  t*.020;
  RG2.rotation.z = -t*.035;
  RG3.rotation.z =  t*.014;

  // core
  const pulse=.88+.12*Math.sin(t*1.5);
  coreMat.opacity=(.48+_bs*.38)*pulse;
  coreSprite.scale.setScalar(.16+_bs*.16);

  // nebula breathes
  nebMat.opacity=.12+_bs*.26;
  nebSprite.scale.setScalar(.42+_bs*.52);

  // halo
  haloMat.opacity=.07+_bs*.14;
  haloSprite.scale.setScalar(1.65+_bs*.75);

  // ping
  if(pingT>=0){ pingT+=dt*1.5; const k=Math.max(0,1-pingT); mandalaGrp.scale.setScalar(1+k*.12); if(pingT>1.3){pingT=-1;mandalaGrp.scale.setScalar(1);} }

  scene.traverse(hideNB); bComp.render(); restV(); fComp.render();
}
frame();

// ═════════════════════════════════════════════════════════════
//  BREATH ANIMATION
// ═════════════════════════════════════════════════════════════
window.toggleAnim=function(){
  _animating=!_animating;
  document.getElementById('animBtn').classList.toggle('on',_animating);
  document.getElementById('animBtn').textContent=_animating?'■ Stop':'▶ Live breath';
  if(_animating){_animStart=null;breathTick();}
  else if(_animRaf) cancelAnimationFrame(_animRaf);
};

function breathTick(){
  if(!_animating)return;
  const speed=parseFloat(document.getElementById('speedSelect').value);
  const now=performance.now()/1000*speed;
  if(!_animStart)_animStart=now;
  const el=(now-_animStart)%CYCLE;
  let ph=0,acc=0;
  for(let p=0;p<4;p++){ if(el<acc+PHASE_DUR[p]){ph=p;_phaseT=(el-acc)/PHASE_DUR[p];break;} acc+=PHASE_DUR[p]; }
  _phase=ph;
  document.getElementById('phaseSelect').value=ph;
  updateBreathUI(ph,_phaseT);
  _animRaf=requestAnimationFrame(breathTick);
}

document.getElementById('phaseSelect').addEventListener('change',function(){
  _phase=parseInt(this.value);_phaseT=0;updateBreathUI(_phase,0);
});

function updateBreathUI(ph,pt){
  document.getElementById('breathLabel').textContent=PHASE_NAMES[ph];
  document.getElementById('phasePct').textContent=Math.round(pt*100)+'%';
}

// ═════════════════════════════════════════════════════════════
//  VARIANTS UI
// ═════════════════════════════════════════════════════════════
(function(){
  const row=document.getElementById('variantRow');
  VARIANTS.forEach((v,i)=>{
    const b=document.createElement('button');
    b.className='vbtn'+(i===0?' active':'');
    b.textContent=v.id+' — '+v.name;
    b.onclick=()=>{
      _variant=i;
      document.querySelectorAll('.vbtn').forEach((x,j)=>x.classList.toggle('active',j===i));
      bloomPass.strength=v.bloomStr; bloomPass.radius=v.bloomRad; bloomPass.threshold=v.bloomThr;
    };
    row.appendChild(b);
  });
})();

window.choose=function(){
  const v=VARIANTS[_variant];
  const b=document.getElementById('banner');
  b.textContent='✓ Variant '+v.id+' "'+v.name+'" — tell me to ship it into index.html';
  b.style.display='';
  setTimeout(()=>{b.style.display='none';},5000);
};

updateBreathUI(3,0);
</script>
