<script type="module">
import * as THREE from 'three';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';

// ═════════════════════════════════════════════════════════════
//  MANDALA POINT GENERATOR — HD VERSION
//  Identical geometry to the standard version.
//  Only the particle counts are increased (~3×) so each curve
//  is sampled more densely. Sizes are scaled down to match.
//  Pattern shape is mathematically identical.
// ═════════════════════════════════════════════════════════════
function buildMandala(){
  const pts = [];
  const PI2 = Math.PI * 2;
  // sub: index of the distinct sub-element within the layer.
  // Adjacent sub-elements alternate CW/CCW via sub%2 in updateParticles.
  let _sub = 0;

  function ring(r, n, layer, bright, zSpread=0){
    const s=_sub++;
    for(let i=0;i<n;i++){
      const a=(i/n)*PI2, z=(Math.random()-.5)*zSpread;
      pts.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z, layer, bright, sub:s});
    }
  }

  function arcPts(cx,cy,r,a0,a1,n,layer,bright,zSpread=0){
    const s=_sub++;
    for(let i=0;i<n;i++){
      const t=i/(n-1), a=a0+(a1-a0)*t, z=(Math.random()-.5)*zSpread;
      pts.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r, z, layer, bright, sub:s});
    }
  }

  // ── LAYER 0 — core cluster ──
  for(let i=0;i<220;i++){
    const r=Math.random()*.12, a=Math.random()*PI2;
    pts.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z:(Math.random()-.5)*.05, layer:0, bright:1.0, sub:0});
  }
  _sub++;

  // ── LAYER 1 — ring + Star of David (ring=sub0, triangle1=sub1, triangle2=sub2) ──
  ring(.22, 200, 1, .95, .04);
  for(let t=0;t<2;t++){
    const offset=t===0?0:Math.PI/3;
    for(let v=0;v<3;v++){
      const a0=(v/3)*PI2+offset-Math.PI/2, a1=((v+1)/3)*PI2+offset-Math.PI/2;
      arcPts(0,0,.22,a0,a1,84,1,.90,.04);
    }
  }

  // ── LAYER 2 — ring + 12 petals (ring=sub0, each petal its own sub) ──
  ring(.45, 280, 2, .88, .06);
  for(let i=0;i<12;i++){
    const a=(i/12)*PI2, cx=Math.cos(a)*.22, cy=Math.sin(a)*.22;
    arcPts(cx,cy,.26, a+.1, a+PI2/12-.1, 62, 2, .85, .06);
  }

  // ── LAYER 3 — Flower of Life (each of 6 circles its own sub) ──
  ring(.45, 18, 3, .80, .06);
  const folR=.45;
  for(let i=0;i<6;i++){
    const ca=(i/6)*PI2;
    arcPts(Math.cos(ca)*folR, Math.sin(ca)*folR, folR, 0, PI2, 190, 3, .78, .07);
  }
  ring(.45, 70, 3, .82, .05);

  // ── LAYER 4 — Sri Yantra: each of 9 triangles its own sub ──
  const sriR=[.30,.44,.58,.70,.82,.94,1.06,1.18,1.30];
  sriR.forEach((r,ri)=>{
    const up=ri%2===0, baseAngle=up?-Math.PI/2:Math.PI/2;
    const s=_sub++; // all 3 sides of same triangle share one sub
    for(let v=0;v<3;v++){
      const a0=baseAngle+(v/3)*PI2, a1=baseAngle+((v+1)/3)*PI2;
      // push directly so all 3 sides share same sub s
      for(let j=0;j<108;j++){
        const tt=j/107, a=a0+(a1-a0)*tt, z=(Math.random()-.5)*.07;
        pts.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z, layer:4, bright:.72+.04*(3-Math.abs(ri-4))*.1, sub:s});
      }
    }
  });

  // ── LAYER 5 — ring + 24 petals ──
  ring(.88, 420, 5, .70, .09);
  for(let i=0;i<24;i++){
    const a=(i/24)*PI2, cx=Math.cos(a)*.44, cy=Math.sin(a)*.44;
    arcPts(cx,cy,.48, a+.05, a+PI2/24-.05, 49, 5, .65, .08);
  }

  // ── LAYER 6 — inner ring, 6 spokes, 6 cross-spokes, outer ring, 12 ticks ──
  ring(1.10, 540, 6, .62, .10);
  for(let i=0;i<6;i++){
    const a=(i/6)*PI2;
    arcPts(0,0,1.10, a-.008, a+.008, 84, 6, .68, .08);
  }
  for(let i=0;i<6;i++){
    const a=(i/6)*PI2+Math.PI/6;
    arcPts(0,0,1.10, a-.006, a+.006, 66, 6, .60, .08);
  }
  ring(1.28, 420, 6, .58, .11);
  for(let i=0;i<12;i++){
    const a=(i/12)*PI2;
    arcPts(0,0,1.28, a-.004, a+.004, 42, 6, .65, .09);
  }

  // ── LAYER 7 — 3 halos, each its own sub ──
  [1.48,1.65,1.82].forEach((r,ri)=>{
    ring(r, 540+ri*108, 7, .50-.08*ri, .12+ri*.04);
    for(let i=0;i<12;i++){
      const a=(i/12)*PI2+(ri*.13), r0=r-.04, r1=r+.04;
      for(let j=0;j<24;j++){
        const rr=r0+(r1-r0)*j/23;
        pts.push({x:Math.cos(a)*rr, y:Math.sin(a)*rr, z:(Math.random()-.5)*.12, layer:7, bright:.55-.04*ri, sub:ri});
      }
    }
  });

  // ── LAYER 8 — fringe stardust ──
  for(let i=0;i<800;i++){
    const r=1.88+Math.random()*.50, a=Math.random()*PI2;
    pts.push({x:Math.cos(a)*r, y:Math.sin(a)*r, z:(Math.random()-.5)*.28, layer:8, bright:.35+Math.random()*.15, sub:0});
  }

  return pts;
}

// ═════════════════════════════════════════════════════════════
//  VARIANTS
// ═════════════════════════════════════════════════════════════

      [0.18,.35,.82],

];

// ═════════════════════════════════════════════════════════════
//  BREATH
// ═════════════════════════════════════════════════════════════
const PHASE_NAMES = ['Breathe in','Hold','Breathe out','Rest'];
const PHASE_DUR   = [4,4,6,2];
const CYCLE       = 16;
let _phase=3, _phaseT=0, _bs=0.72;
let _animating=false, _animStart=null, _animRaf=null;
let _variant=2;  // default: Golden Om

function bsTarget(ph,pt){
  if(ph===0) return .72+pt*.28;
  if(ph===1) return 1.0;
  if(ph===2) return 1.0-pt*.28;
  return .72;
}

// ═════════════════════════════════════════════════════════════
//  BUILD POINT DATA
// ═════════════════════════════════════════════════════════════
const RAW = buildMandala();
const N   = RAW.length;

const homeX   = new Float32Array(N);
const homeY   = new Float32Array(N);
const homeZ   = new Float32Array(N);
const homeR   = new Float32Array(N);
const layerArr= new Uint8Array(N);
const subArr  = new Uint16Array(N);    // sub-element index → drives CW/CCW per element
const brightArr=new Float32Array(N);
const shimPh  = new Float32Array(N);
const isBig   = new Uint8Array(N);

RAW.forEach((p,i)=>{
  homeX[i]=p.x; homeY[i]=p.y; homeZ[i]=p.z;
  homeR[i]=Math.sqrt(p.x*p.x+p.y*p.y);
  layerArr[i]=p.layer; brightArr[i]=p.bright;
  subArr[i]=p.sub||0;
  shimPh[i]=Math.random()*Math.PI*2;
  isBig[i] = Math.random() < (.7-.08*p.layer) ? 1 : 0;
});

// ── RIPPLE STATE ──
// _rippleT: -1=inactive, 0→1 = wave travelling outward over 2.5s
let _rippleT   = -1;
let _lastPhase = 3;

// ═════════════════════════════════════════════════════════════
//  THREE.JS
// ═════════════════════════════════════════════════════════════
const canvas  = document.getElementById('medCanvas');
const BLOOM_L = 1;
const bMask   = new THREE.Layers(); bMask.set(BLOOM_L);

const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setClearColor(0,0);
const DPR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.60;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36,1,.1,100);
camera.position.set(0,0,5.2);
camera.layers.enableAll();

const mandalaGrp = new THREE.Group(); scene.add(mandalaGrp);
const ringGrp    = new THREE.Group(); scene.add(ringGrp);

function gradSprite(stops){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'), gr=g.createRadialGradient(128,128,0,128,128,128);
  stops.forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

const coreMat=new THREE.SpriteMaterial({
  map:gradSprite([[0,'rgba(255,255,255,.98)'],[.15,'rgba(220,200,255,.78)'],[.38,'rgba(160,120,255,.38)'],[.65,'rgba(100,70,220,.12)'],[1,'rgba(0,0,0,0)']]),
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,opacity:.82,
});
const coreSprite=new THREE.Sprite(coreMat); coreSprite.scale.setScalar(.22); coreSprite.layers.set(BLOOM_L); scene.add(coreSprite);

// ── NEBULA — particle cloud (JARVIS-style fluid sphere drift) ──
// Each particle has a unit direction on a sphere + 3 independent sine phases.
// Position = dir * (baseR * breathScale) + small 3-axis sine drift.
// Identical motion model to the JARVIS avatar — organic, fluid, alive.
const NEB_N   = 320;
const nebDir  = new Float32Array(NEB_N*3);  // unit direction on sphere
const nebBase = new Float32Array(NEB_N);    // base radius (0.04–0.28)
const nebPh   = new Float32Array(NEB_N*3);  // 3 independent drift phases per particle
const nebBig  = new Uint8Array(NEB_N);
const nebPosB = new Float32Array(NEB_N*3);
const nebColB = new Float32Array(NEB_N*3);
const nebSzB  = new Float32Array(NEB_N);

for(let i=0;i<NEB_N;i++){
  // Uniform random point on unit sphere
  const cosT = Math.random()*2-1, phi = Math.random()*Math.PI*2;
  const sinT = Math.sqrt(1-cosT*cosT);
  nebDir[i*3]=sinT*Math.cos(phi); nebDir[i*3+1]=sinT*Math.sin(phi); nebDir[i*3+2]=cosT;
  // Radius distribution: dense core + sparse outer halo (mirrors JARVIS base dist)
  const roll = Math.random();
  nebBase[i] = roll < 0.62 ? 0.06 + Math.random()*0.14   // core cluster
             : roll < 0.90 ? Math.pow(Math.random(),1.6)*0.04 // very inner
             :               0.04 + Math.random()*0.10;   // mid halo
  nebPh[i*3]   = Math.random()*Math.PI*2;
  nebPh[i*3+1] = Math.random()*Math.PI*2;
  nebPh[i*3+2] = Math.random()*Math.PI*2;
  nebBig[i] = Math.random()<0.25 ? 1 : 0;
}

const nebGeo = new THREE.BufferGeometry();
nebGeo.setAttribute('position', new THREE.BufferAttribute(nebPosB, 3));
nebGeo.setAttribute('color',    new THREE.BufferAttribute(nebColB, 3));
nebGeo.setAttribute('aSize',    new THREE.BufferAttribute(nebSzB,  1));
// nebMesh created after pMat is defined (see below)

const haloMat=new THREE.SpriteMaterial({
  map:gradSprite([[0,'rgba(165,135,255,.38)'],[.28,'rgba(115,85,238,.16)'],[.58,'rgba(75,52,198,.06)'],[1,'rgba(0,0,0,0)']]),
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,opacity:.14,
});
const haloSprite=new THREE.Sprite(haloMat); haloSprite.scale.setScalar(2.2); haloSprite.position.z=-1.0; haloSprite.layers.set(BLOOM_L); scene.add(haloSprite);

// ── PARTICLES ──
const pPos  = new Float32Array(N*3);
const pCol  = new Float32Array(N*3);
const pSz   = new Float32Array(N);
const pGeo  = new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',   new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('aSize',   new THREE.BufferAttribute(pSz,1));

const dotTex=(function(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(.25,'rgba(215,195,255,.94)');
  gr.addColorStop(.55,'rgba(155,115,255,.42)');
  gr.addColorStop(1,'rgba(85,52,210,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();

const pMat=new THREE.ShaderMaterial({
  uniforms:{uScale:{value:160},uTex:{value:dotTex}},
  vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:'attribute float aSize;varying vec3 vCol;uniform float uScale;\nvoid main(){vCol=color;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*uScale/-mv.z;gl_Position=projectionMatrix*mv;}',
  fragmentShader:'uniform sampler2D uTex;varying vec3 vCol;\nvoid main(){vec4 t=texture2D(uTex,gl_PointCoord);gl_FragColor=vec4(vCol*t.rgb,t.a);}',
});
const ptsMesh=new THREE.Points(pGeo,pMat); ptsMesh.layers.set(0); mandalaGrp.add(ptsMesh);
// Nebula mesh — created here so pMat is already defined
const nebMesh = new THREE.Points(nebGeo, pMat); nebMesh.layers.set(BLOOM_L); scene.add(nebMesh);

// ── HUD RINGS ──
function arcLine(r,segs,col,op,s0,len){
  const v=[]; const s=s0||0,l=len!=null?len:Math.PI*2;
  for(let i=0;i<=segs;i++){const a=s+(i/segs)*l; v.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0));}
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(v),
    new THREE.LineBasicMaterial({color:new THREE.Color(col),transparent:true,opacity:op,depthWrite:false}));
  ln.layers.set(0); return ln;
}
const RG1=new THREE.Group(); ringGrp.add(RG1);
[[.30,2.05],[3.00,1.38],[5.38,.88]].forEach(([s,l])=>{
  RG1.add(arcLine(1.96,90,'#8b7cf8',.80,s,l));
  RG1.add(arcLine(1.98,90,'#8b7cf8',.32,s,l));
});
const RG2=new THREE.Group(); ringGrp.add(RG2);
RG2.add(arcLine(2.20,200,'#a78bfa',.62));
const RG3=new THREE.Group(); ringGrp.add(RG3);
(function(){
  const T=72,r=2.44,sm=[],lg=[];
  for(let i=0;i<T;i++){const maj=i%6===0,a=(i/T)*Math.PI*2,c=Math.cos(a),s=Math.sin(a),inn=maj?r-.09:r-.045;(maj?lg:sm).push(c*inn,s*inn,0,c*r,s*r,0);}
  const gSm=new THREE.BufferGeometry(); gSm.setAttribute('position',new THREE.BufferAttribute(new Float32Array(sm),3));
  RG3.add(new THREE.LineSegments(gSm,new THREE.LineBasicMaterial({color:0xb4a4f8,transparent:true,opacity:.26,depthWrite:false})));
  const gLg=new THREE.BufferGeometry(); gLg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lg),3));
  RG3.add(new THREE.LineSegments(gLg,new THREE.LineBasicMaterial({color:0xddd6fe,transparent:true,opacity:.62,depthWrite:false})));
})();

// ── BLOOM ──
let bloomPass=new UnrealBloomPass(new THREE.Vector2(1,1),1.40,.65,.08);
const bComp=new EffectComposer(renderer); bComp.renderToScreen=false;
bComp.addPass(new RenderPass(scene,camera)); bComp.addPass(bloomPass);
const fPass=new ShaderPass(new THREE.ShaderMaterial({
  uniforms:{baseTexture:{value:null},bloomTexture:{value:bComp.renderTarget2.texture}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D baseTexture;uniform sampler2D bloomTexture;varying vec2 vUv;void main(){gl_FragColor=texture2D(baseTexture,vUv)+vec4(texture2D(bloomTexture,vUv).rgb,0.);}',
}),'baseTexture'); fPass.needsSwap=true;
const fComp=new EffectComposer(renderer);
fComp.addPass(new RenderPass(scene,camera)); fComp.addPass(fPass);

const _hid=[];
function hideNB(o){if((o.isMesh||o.isPoints||o.isLine||o.isLineSegments||o.isSprite)&&!o.layers.test(bMask)&&o.visible){o.visible=false;_hid.push(o);}}
function restV(){_hid.forEach(o=>o.visible=true);_hid.length=0;}

function sizeR(){
  const s=canvas.clientWidth||360;
  renderer.setSize(s,s,false); bComp.setSize(s,s); fComp.setSize(s,s);
  camera.aspect=1; camera.updateProjectionMatrix();
  pMat.uniforms.uScale.value=160*(s*DPR)/720;
}
new ResizeObserver(sizeR).observe(canvas); sizeR();

// ── NEBULA UPDATE — JARVIS-style fluid sphere drift ──
// Warm white-gold core fading to deep amber at the edge.
const NEB_INNER = [1.00, 0.90, 0.50];  // #ffe580 — bright warm gold
const NEB_OUTER = [0.85, 0.48, 0.05];  // #d97a0d — deep amber

function updateNebula(t, bs){
  // Sphere breathes: expands slightly on inhale
  const breathScale = 1.0 + (bs-.72)/.28 * 0.18;
  // Drift amplitude — small enough that particles never leave the core zone
  const dA = 0.022, dS = 0.75;

  for(let i=0;i<NEB_N;i++){
    const x=nebDir[i*3], y=nebDir[i*3+1], z=nebDir[i*3+2];
    const r = nebBase[i] * breathScale;

    // 3-axis independent sine drift — identical to JARVIS particle motion
    const dx = Math.sin(t*dS + nebPh[i*3])   * dA;
    const dy = Math.cos(t*dS + nebPh[i*3+1]) * dA;
    const dz = Math.sin(t*dS + nebPh[i*3+2]) * dA;

    nebPosB[i*3]   = x*r + dx;
    nebPosB[i*3+1] = y*r + dy;
    nebPosB[i*3+2] = z*r + dz;

    // Depth cue — front particles brighter (same as JARVIS)
    const depth = (z + 1) * 0.5;
    const norm  = Math.min(nebBase[i] / 0.20, 1.0); // 0=core, 1=edge
    const bright = (0.07 + (1-norm)*0.07) * (0.75 + depth*0.25);

    nebColB[i*3]   = (NEB_INNER[0]*(1-norm) + NEB_OUTER[0]*norm) * bright;
    nebColB[i*3+1] = (NEB_INNER[1]*(1-norm) + NEB_OUTER[1]*norm) * bright;
    nebColB[i*3+2] = (NEB_INNER[2]*(1-norm) + NEB_OUTER[2]*norm) * bright;

    // Big particles slightly larger — same 30% big/70% small split as JARVIS
    const base = nebBig[i] ? 0.11 : 0.075;
    nebSzB[i] = (base + 0.03*(1-nebBase[i]/0.20)) * (0.65 + 0.55*depth);
  }
  nebGeo.attributes.position.needsUpdate=true;
  nebGeo.attributes.color.needsUpdate=true;
  nebGeo.attributes.aSize.needsUpdate=true;
}

// ═════════════════════════════════════════════════════════════
//  PARTICLE UPDATE
// ═════════════════════════════════════════════════════════════
// Per-layer spin speed multipliers — slight variation makes it feel like
// a real gyroscope rather than uniform rotation. Odd layers CW, even CCW.
// Sub-element speeds: slight variation per layer so elements within the same
// pattern move at subtly different rates, making the gears feel organic.
const LAYER_SPEED = [0.70, 1.00, 0.85, 1.15, 0.90, 1.05, 0.80, 1.10, 0.95];

// Pre-allocated cos/sin caches — filled per unique sub index each frame.
// Max sub index won't exceed ~120, so 256 is safe.
const _cosCache = new Float32Array(256);
const _sinCache = new Float32Array(256);

function updateParticles(t){
  const v  = VARIANTS[_variant];
  const bs = _bs;

  const breathS = 1.0 + (bs-.72) * .40;
  const tilt = (bs-.72)/.28 * v.tiltAmp;
  const cosTilt=Math.cos(tilt), sinTilt=Math.sin(tilt);
  const baseSpeed = v.spinSpeed;

  // Fill cos/sin cache for every sub index present.
  // Direction = sub%2 === 0 ? +1 (CCW) : -1 (CW) → adjacent elements oppose.
  // Speed scaled by the layer's LAYER_SPEED, looked up via layerArr per particle.
  // We pre-fill for all 256 slots using a rough per-sub layer estimate;
  // actual per-particle lookup in the loop uses the particle's own layer.
  for(let s=0;s<256;s++){
    const dir = (s%2===0) ? 1 : -1;
    const a   = t * baseSpeed * dir;
    _cosCache[s]=Math.cos(a); _sinCache[s]=Math.sin(a);
  }

  for(let i=0;i<N;i++){
    const lay=layerArr[i];
    const sub=subArr[i];
    const hx=homeX[i], hy=homeY[i], hz=homeZ[i];

    // Direction alternates per sub-element: even sub=CCW, odd sub=CW
    const dir  = (sub%2===0) ? 1 : -1;
    const rotA = t * baseSpeed * LAYER_SPEED[lay] * dir;
    const cA   = Math.cos(rotA), sA = Math.sin(rotA);

    const sx=(hx*cA - hy*sA)*breathS;
    const sy=(hx*sA + hy*cA)*breathS;
    const sz=hz;
    const rx=sx, ry=sy, rz=sz;
    const ty= ry*cosTilt - rz*sinTilt;
    const tz= ry*sinTilt + rz*cosTilt;

    pPos[i*3]=rx; pPos[i*3+1]=ty; pPos[i*3+2]=tz;

    const col = v.layerCols[Math.min(layerArr[i], v.layerCols.length-1)];
    const shim = .92 + .08*Math.sin(t*1.8+shimPh[i]);
    const depth = (tz+1.5)/3.0;
    const dbright = .82 + .18*(depth*depth);

    // ── RIPPLE WAVE ──
    // Wave front travels from r=0 to r=2.4 over 2.5s.
    // Particles near the front flash up to 3× brighter then fade back.
    let ripple = 1.0;
    if(_rippleT >= 0){
      const front = _rippleT * 2.4;          // 0 → 2.4 (covers fringe)
      const dist  = Math.abs(homeR[i] - front);
      if(dist < 0.30) ripple = 1.0 + (1.0 - dist/0.30) * 2.0;
    }

    const a = brightArr[i]*shim*dbright*0.85*ripple;
    pCol[i*3]=col[0]*a; pCol[i*3+1]=col[1]*a; pCol[i*3+2]=col[2]*a;

    const baseSize = layerArr[i]<=1 ? .175
                   : layerArr[i]<=3 ? .145
                   : layerArr[i]<=5 ? .122
                   : layerArr[i]<=6 ? .105
                   : .082;
    pSz[i] = baseSize*(isBig[i]?1.85:1)*(.65+.55*depth);
  }

  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
  pGeo.attributes.aSize.needsUpdate=true;
}

// ── MAIN LOOP ──
const clock=new THREE.Clock();
let pingT=-1;
canvas.addEventListener('click',()=>{ pingT=.01; });

function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;

  _bs+=( bsTarget(_phase,_phaseT)-_bs )*Math.min(1,dt*3.0);

  // fire ripple on every phase change when animating, loop continuously
  if(_phase!==_lastPhase) _rippleT=0;
  _lastPhase=_phase;
  // advance wave; when it reaches the fringe restart immediately if animating
  if(_rippleT>=0){
    _rippleT+=dt/2.5;
    if(_rippleT>1.1){ _rippleT = _animating ? 0 : -1; }
  }

  updateParticles(t);

  RG1.rotation.z =  t*.020;
  RG2.rotation.z = -t*.035;
  RG3.rotation.z =  t*.014;

  const pulse=.88+.12*Math.sin(t*1.5);
  coreMat.opacity=(.48+_bs*.38)*pulse;
  coreSprite.scale.setScalar(.16+_bs*.16);

  updateNebula(t, _bs);

  haloMat.opacity=.07+_bs*.14;
  haloSprite.scale.setScalar(1.65+_bs*.75);

  if(pingT>=0){ pingT+=dt*1.5; const k=Math.max(0,1-pingT); mandalaGrp.scale.setScalar(1+k*.12); if(pingT>1.3){pingT=-1;mandalaGrp.scale.setScalar(1);} }

  scene.traverse(hideNB); bComp.render(); restV(); fComp.render();
}
frame();

// ═════════════════════════════════════════════════════════════
//  BREATH ANIMATION
// ═════════════════════════════════════════════════════════════
window.toggleAnim=function(){
  _animating=!_animating;
  document.getElementById('animBtn').classList.toggle('on',_animating);
  document.getElementById('animBtn').textContent=_animating?'■ Stop':'▶ Live breath';
  if(_animating){_animStart=null;breathTick();}
  else if(_animRaf) cancelAnimationFrame(_animRaf);
};

function breathTick(){
  if(!_animating)return;
  const speed=parseFloat(document.getElementById('speedSelect').value);
  const now=performance.now()/1000*speed;
  if(!_animStart)_animStart=now;
  const el=(now-_animStart)%CYCLE;
  let ph=0,acc=0;
  for(let p=0;p<4;p++){ if(el<acc+PHASE_DUR[p]){ph=p;_phaseT=(el-acc)/PHASE_DUR[p];break;} acc+=PHASE_DUR[p]; }
  _phase=ph;
  document.getElementById('phaseSelect').value=ph;
  updateBreathUI(ph,_phaseT);
  _animRaf=requestAnimationFrame(breathTick);
}

document.getElementById('phaseSelect').addEventListener('change',function(){
  _phase=parseInt(this.value);_phaseT=0;updateBreathUI(_phase,0);
});

function updateBreathUI(ph,pt){
  document.getElementById('breathLabel').textContent=PHASE_NAMES[ph];
  document.getElementById('phasePct').textContent=Math.round(pt*100)+'%';
}

// ═════════════════════════════════════════════════════════════
//  VARIANTS UI
// ═════════════════════════════════════════════════════════════
(function(){
  const row=document.getElementById('variantRow');
  VARIANTS.forEach((v,i)=>{
    const b=document.createElement('button');
    b.className='vbtn'+(i===_variant?' active':'');
    b.textContent=v.id+' — '+v.name;
    b.onclick=()=>{
      _variant=i;
      document.querySelectorAll('.vbtn').forEach((x,j)=>x.classList.toggle('active',j===i));
      bloomPass.strength=v.bloomStr; bloomPass.radius=v.bloomRad; bloomPass.threshold=v.bloomThr;
    };
    row.appendChild(b);
  });
  // init bloom for default variant
  const dv=VARIANTS[_variant];
  bloomPass.strength=dv.bloomStr; bloomPass.radius=dv.bloomRad; bloomPass.threshold=dv.bloomThr;
})();

window.choose=function(){
  const v=VARIANTS[_variant];
  const b=document.getElementById('banner');
  b.textContent='✓ Variant '+v.id+' "'+v.name+'" — tell me to ship it into index.html';
  b.style.display='';
  setTimeout(()=>{b.style.display='none';},5000);
};

updateBreathUI(3,0);
</script>
